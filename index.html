<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangladesh Social Benefit Watch</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="language">
        <button id="bangla">বাংলা</button>
        <button id="english">English</button>
    </div>

    <h1 id="site-title">Bangladesh Social Benefit Watch</h1>
</header>

<main>

    <section class="location">
        <h2 id="explore-title">Explore Bangladesh</h2>

        <label for="bibhag" id="bibhag-label">division</label>
        <select id="bibhag">
            <option value="">Select a division </option>
        </select>

        <label for="jela" id="jela-label">district</label>
        <select id="jela" disabled>
            <option value="">Select a district </option>
        </select>

        <label for="upazila" id="upazila-label">Sub district</label>
        <select id="upazila" disabled>
            <option value="">Select an sub district </option>
        </select>
    </section>

    <section class="empty-section" id="graphs">
        <h2 id="graphs-title">Graphs</h2>
        <p id="graphs-message">No information has been added yet.</p>
    </section>

    <section class="empty-section" id="information">
        <h2 id="information-title">Information</h2>
        <p id="information-message">No information has been added yet.</p>
    </section>

</main>

<footer>
    <p id="footer-text">Bangladesh Social Benefit Watch</p>
</footer>

<script src="script.js"></script>
</body>
</html>
